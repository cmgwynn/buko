name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Export web app
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.EXPO_PUBLIC_SUPABASE_URL;
          const key = process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY;
          if (!url || !URL.canParse(url) || new URL(url).protocol !== 'https:') {
            throw new Error('EXPO_PUBLIC_SUPABASE_URL must be a valid HTTPS URL.');
          }
          if (!key || key.length < 20 || key === 'your-supabase-anon-key') {
            throw new Error('EXPO_PUBLIC_SUPABASE_ANON_KEY is missing or invalid.');
          }
          NODE
          npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_USDA_API_KEY: ${{ secrets.EXPO_PUBLIC_USDA_API_KEY }}
          EXPO_PUBLIC_CONTACT_EMAIL: ${{ secrets.EXPO_PUBLIC_CONTACT_EMAIL }}
      - name: Add route fallback
        run: cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
